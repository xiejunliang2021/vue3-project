<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS 笔记牢笼与本地 AI 降维打击</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0d16;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #network {
            width: 100%;
            height: 100%;
        }
        .scanline {
            width: 100%;
            height: 4px;
            background: linear-gradient(to bottom, rgba(0, 255, 204, 0) 0%, rgba(0, 255, 204, 0.4) 10%, rgba(0, 255, 204, 0) 100%);
            position: absolute;
            animation: scan 4s linear infinite;
            z-index: 10;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: -4px; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div id="network"></div>

    <script type="text/javascript">
        var nodesArray = [
            // 本地化 AI 大脑核心生态
            { id: 1, label: "本地化 AI 大脑\n(第二大脑)", value: 40, color: { background: "#00ffcc", border: "#00ffcc" } },
            { id: 2, label: "智能体 Hermes", value: 25, color: { background: "#39ff14", border: "#39ff14" } },
            { id: 3, label: "Obsidian 私有库", value: 25, color: { background: "#39ff14", border: "#39ff14" } },
            { id: 4, label: "纯 Markdown 格式", value: 20, color: { background: "#00b3ff", border: "#00b3ff" } },
            { id: 5, label: "物理防漏沙盒", value: 20, color: { background: "#00b3ff", border: "#00b3ff" } },

            // SaaS 云端黑洞生态
            { id: 10, label: "SaaS 云端平台\n(数据数据牢笼)", value: 35, color: { background: "#ff007f", border: "#ff007f" } },
            { id: 11, label: "数据资产绑架\n(宕机/改协议/封号)", value: 22, color: { background: "#ff5555", border: "#ff5555" } },
            { id: 12, label: "数据隐私泄露\n(用户数据遭监视)", value: 22, color: { background: "#ff5555", border: "#ff5555" } },
            { id: 13, label: "免费 AI 训练养料", value: 20, color: { background: "#e5ff00", border: "#e5ff00" } }
        ];

        var edgesArray = [
            // 降维打击关系
            { from: 1, to: 10, label: "💥 降维打击", color: "#ff0000", width: 3, arrows: "to" },

            // 本地生态连接
            { from: 1, to: 2, label: "核心编排" },
            { from: 1, to: 3, label: "底层存储" },
            { from: 3, to: 4, label: "纯文本标准" },
            { from: 2, to: 5, label: "本地安全调用" },
            { from: 5, to: 3, label: "数据不外泄" },

            // SaaS 隐患连接
            { from: 10, to: 11, label: "锁定绑定风险" },
            { from: 10, to: 12, label: "窥探与隐私风险" },
            { from: 12, to: 13, label: "喂养云端模型" }
        ];

        var container = document.getElementById('network');
        var data = {
            nodes: new vis.DataSet(nodesArray),
            edges: new vis.DataSet(edgesArray)
        };

        var options = {
            nodes: {
                shape: 'dot',
                font: {
                    color: '#ffffff',
                    size: 16,
                    face: 'monospace',
                    strokeWidth: 2,
                    strokeColor: '#0b0d16'
                },
                borderWidth: 2,
                shadow: {
                    enabled: true,
                    color: 'rgba(0, 255, 204, 0.3)',
                    size: 10,
                    x: 0,
                    y: 0
                }
            },
            edges: {
                color: {
                    color: 'rgba(255, 255, 255, 0.2)',
                    highlight: '#00ffcc',
                    hover: '#00ffcc'
                },
                font: {
                    color: '#8c92ac',
                    size: 11,
                    face: 'monospace',
                    strokeWidth: 1,
                    strokeColor: '#0b0d16'
                },
                arrows: {
                    to: { enabled: true, scaleFactor: 0.5 }
                },
                smooth: {
                    enabled: true,
                    type: 'cubicBezier',
                    roundness: 0.5
                }
            },
            physics: {
                enabled: true,
                solver: 'forceAtlas2Based',
                forceAtlas2Based: {
                    gravitationalConstant: -200,
                    centralGravity: 0.012,
                    springConstant: 0.04,
                    springLength: 170,
                    damping: 0.45,
                    avoidOverlap: 1
                },
                stabilization: {
                    enabled: false
                }
            },
            interaction: {
                hover: true,
                dragNodes: true,
                dragView: true,
                zoomView: true
            }
        };

        var network = new vis.Network(container, data, options);
    </script>
</body>
</html>
