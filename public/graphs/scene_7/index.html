<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分镜 7: 六步自动化 Pipeline</title>
  <style>
    :root {
      --bg: #060913;
      --green: #39ff14;
      --red: #ff3b3b;
      --cyan: #00fff0;
      --magenta: #ff2d78;
      --blue: #00b3ff;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }
    #stage {
      position: relative;
      width: 900px;
      height: 640px;
      background: #060913;
      border: 2px solid #1a233d;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
      overflow: hidden;
      box-sizing: border-box;
    }
    .cyber-card {
      position: absolute;
      border: 2px solid var(--border-color, #1a233d);
      background: rgba(6, 9, 19, 0.95);
      padding: 15px;
      box-sizing: border-box;
      box-shadow: 0 0 15px var(--glow-color, rgba(0, 243, 255, 0.15));
      border-radius: 4px;
    }
    .font-mono {
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }
  </style>
  <script type="text/javascript" src="js/gsap.min.js"></script>
</head>
<body>
  <div id="stage" data-composition-id="root" data-start="0" data-duration="10" data-width="900" data-height="640">
    
      <div id="board-win" class="cyber-card" style="left: 50px; top: 120px; width: 800px; height: 320px; --border-color: var(--cyan); overflow: visible;">
        <svg style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;">
          <path id="pipeline-path" d="M 100 160 L 700 160" fill="none" stroke="#1a233d" stroke-width="4" />
          <path id="flow-path" d="M 100 160 L 700 160" fill="none" stroke="var(--cyan)" stroke-width="4" stroke-dasharray="600" stroke-dashoffset="600" />
        </svg>
        <div class="pipe-node font-mono" id="node-1" style="position: absolute; left: 60px; top: 120px; text-align: center; width: 80px;">
          <div style="font-size: 32px;">🐦</div>
          <div style="font-size: 10px; color: #8c92ac; margin-top: 5px;">1. Twitter搜</div>
        </div>
        <div class="pipe-node font-mono" id="node-2" style="position: absolute; left: 180px; top: 120px; text-align: center; width: 80px;">
          <div style="font-size: 32px;">🔎</div>
          <div style="font-size: 10px; color: #8c92ac; margin-top: 5px;">2. 融资筛选</div>
        </div>
        <div class="pipe-node font-mono" id="node-3" style="position: absolute; left: 300px; top: 120px; text-align: center; width: 80px;">
          <div style="font-size: 32px;">🏷️</div>
          <div style="font-size: 10px; color: #8c92ac; margin-top: 5px;">3. AI标签</div>
        </div>
        <div class="pipe-node font-mono" id="node-4" style="position: absolute; left: 420px; top: 120px; text-align: center; width: 80px;">
          <div style="font-size: 32px;">🌐</div>
          <div style="font-size: 10px; color: #8c92ac; margin-top: 5px;">4. 寻找官网</div>
        </div>
        <div class="pipe-node font-mono" id="node-5" style="position: absolute; left: 540px; top: 120px; text-align: center; width: 80px;">
          <div style="font-size: 32px;">👤</div>
          <div style="font-size: 10px; color: #8c92ac; margin-top: 5px;">5. 领英定位</div>
        </div>
        <div class="pipe-node font-mono" id="node-6" style="position: absolute; left: 660px; top: 120px; text-align: center; width: 80px;">
          <div style="font-size: 32px;">✈️</div>
          <div style="font-size: 10px; color: #8c92ac; margin-top: 5px;">6. 自动私信</div>
        </div>
        <div id="stamp" class="font-mono" style="position: absolute; left: 250px; top: 80px; border: 4px solid var(--green); border-radius: 10px; color: var(--green); font-size: 48px; font-weight: bold; padding: 10px 40px; transform: rotate(-15deg) scale(3); opacity: 0; box-shadow: 0 0 15px rgba(57,255,20,0.5); background: rgba(6,9,19,0.9); z-index: 10;">
          AUTO RUN
        </div>
      </div>
      <div id="subtitle" style="position: absolute; bottom: 50px; left: 50px; right: 50px; text-align: center; font-size: 24px; color: #fff;">六个步骤。一条指令。全程全自动跑完。</div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    
    
    tl.fromTo("#board-win", {opacity: 0, scale: 0.95}, {opacity: 1, scale: 1, duration: 0.6}, 0.2);
    tl.fromTo(".pipe-node", {scale: 0, opacity: 0}, {scale: 1, opacity: 1, ease: "back.out(1.5)", duration: 0.4, stagger: 0.25}, 0.8);
    tl.to(document.querySelector("#flow-path").style, {strokeDashoffset: 0, duration: 2.0, ease: "none"}, 0.8);
    tl.to("#stamp", {opacity: 1, scale: 1.0, duration: 0.3, ease: "power4.in"}, 3.2);
    tl.to("#flow-path", {stroke: "var(--green)", duration: 0.1}, 3.5);
    tl.to(".pipe-node", {color: "var(--green)", duration: 0.2, stagger: 0.1}, 3.5);
    tl.fromTo("#subtitle", {opacity: 0}, {opacity: 1, duration: 0.5}, 0.2);

    
    window.__timelines["root"] = tl;
    
    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'togglePlay') {
        if (tl.paused()) tl.play(); else tl.pause();
      } else if (e.data.type === 'restart') {
        tl.restart();
      } else if (e.data.type === 'setSpeed') {
        tl.timeScale(e.data.speed);
      }
    });
  </script>
</body>
</html>
