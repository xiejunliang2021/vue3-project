<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes + Obsidian 本地化优势图谱</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0d16;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #network {
            width: 100%;
            height: 100%;
        }
        .scanline {
            width: 100%;
            height: 4px;
            background: linear-gradient(to bottom, rgba(0, 255, 204, 0) 0%, rgba(0, 255, 204, 0.4) 10%, rgba(0, 255, 204, 0) 100%);
            position: absolute;
            animation: scan 4s linear infinite;
            z-index: 10;
            pointer-events: none;
        }
        @keyframes scan {
            0% { top: -4px; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div id="network"></div>

    <script type="text/javascript">
        var nodesArray = [
            { id: 1, label: "Hermes + Obsidian\n本地大脑", value: 40, color: { background: "#ff007f", border: "#ff007f" } },
            
            // 优势1：数据绝对隐私
            { id: 2, label: "数据绝对隐私", value: 25, color: { background: "#00ffcc", border: "#00ffcc" } },
            { id: 21, label: "本地安全沙盒", value: 15, color: { background: "#00b3ff", border: "#00b3ff" } },
            { id: 22, label: "敏感数据不出户", value: 15, color: { background: "#00b3ff", border: "#00b3ff" } },
            
            // 优势2：脱离SaaS绑架
            { id: 3, label: "脱离SaaS绑架", value: 25, color: { background: "#00ffcc", border: "#00ffcc" } },
            { id: 31, label: "纯文本 Markdown", value: 15, color: { background: "#00b3ff", border: "#00b3ff" } },
            { id: 32, label: "无专有格式锁定", value: 15, color: { background: "#00b3ff", border: "#00b3ff" } },
            
            // 优势3：长期记忆与私有库
            { id: 4, label: "长期记忆与私有库", value: 25, color: { background: "#00ffcc", border: "#00ffcc" } },
            { id: 41, label: "CLAUDE.md 感知", value: 15, color: { background: "#00b3ff", border: "#00b3ff" } },
            { id: 42, label: "持久化 Memory", value: 15, color: { background: "#00b3ff", border: "#00b3ff" } },
            
            // 优势4：极客自动化流
            { id: 5, label: "极客自动化流", value: 25, color: { background: "#00ffcc", border: "#00ffcc" } },
            { id: 51, label: "Rclone + R2 备份", value: 15, color: { background: "#00b3ff", border: "#00b3ff" } },
            { id: 52, label: "SSH 反向隧道", value: 15, color: { background: "#00b3ff", border: "#00b3ff" } },
            
            // 优势5：智能体主动缝合
            { id: 6, label: "智能体主动缝合", value: 25, color: { background: "#00ffcc", border: "#00ffcc" } },
            { id: 61, label: "Inbox 自动归档", value: 15, color: { background: "#00b3ff", border: "#00b3ff" } },
            { id: 62, label: "任务看板动态汇总", value: 15, color: { background: "#00b3ff", border: "#00b3ff" } }
        ];

        var edgesArray = [
            { from: 1, to: 2, label: "维度 1" },
            { from: 2, to: 21 },
            { from: 2, to: 22 },
            
            { from: 1, to: 3, label: "维度 2" },
            { from: 3, to: 31 },
            { from: 3, to: 32 },
            
            { from: 1, to: 4, label: "维度 3" },
            { from: 4, to: 41 },
            { from: 4, to: 42 },
            
            { from: 1, to: 5, label: "维度 4" },
            { from: 5, to: 51 },
            { from: 5, to: 52 },
            
            { from: 1, to: 6, label: "维度 5" },
            { from: 6, to: 61 },
            { from: 6, to: 62 }
        ];

        var container = document.getElementById('network');
        var data = {
            nodes: new vis.DataSet(nodesArray),
            edges: new vis.DataSet(edgesArray)
        };

        var options = {
            nodes: {
                shape: 'dot',
                font: {
                    color: '#ffffff',
                    size: 16,
                    face: 'monospace',
                    strokeWidth: 2,
                    strokeColor: '#0b0d16'
                },
                borderWidth: 2,
                shadow: {
                    enabled: true,
                    color: 'rgba(0, 255, 204, 0.3)',
                    size: 10,
                    x: 0,
                    y: 0
                }
            },
            edges: {
                color: {
                    color: 'rgba(255, 255, 255, 0.2)',
                    highlight: '#00ffcc',
                    hover: '#00ffcc'
                },
                font: {
                    color: '#8c92ac',
                    size: 11,
                    face: 'monospace',
                    strokeWidth: 1,
                    strokeColor: '#0b0d16'
                },
                arrows: {
                    to: { enabled: false }
                },
                smooth: {
                    enabled: true,
                    type: 'cubicBezier',
                    roundness: 0.5
                }
            },
            physics: {
                enabled: true,
                solver: 'forceAtlas2Based',
                forceAtlas2Based: {
                    gravitationalConstant: -180,
                    centralGravity: 0.015,
                    springConstant: 0.04,
                    springLength: 150,
                    damping: 0.4,
                    avoidOverlap: 1
                },
                stabilization: {
                    enabled: false
                }
            },
            interaction: {
                hover: true,
                dragNodes: true,
                dragView: true,
                zoomView: true
            }
        };

        var network = new vis.Network(container, data, options);
    </script>
</body>
</html>
