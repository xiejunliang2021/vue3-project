<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>竖屏分镜 7</title>
  <style>
    :root {
      --bg: #060913;
      --green: #39ff14;
      --red: #ff3b3b;
      --cyan: #00fff0;
      --magenta: #ff2d78;
      --blue: #00b3ff;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }
    #stage {
      position: relative;
      width: 640px;
      height: 1138px;
      background: #060913;
      border: 2px solid #1a233d;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
      overflow: hidden;
      box-sizing: border-box;
    }
    .cyber-card {
      position: absolute;
      border: 2px solid var(--border-color, #1a233d);
      background: rgba(6, 9, 19, 0.95);
      padding: 15px;
      box-sizing: border-box;
      box-shadow: 0 0 15px var(--glow-color, rgba(0, 243, 255, 0.15));
      border-radius: 4px;
    }
    .font-mono {
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }
  </style>
  <script type="text/javascript" src="js/gsap.min.js"></script>
</head>
<body>
  <div id="stage" data-composition-id="root" data-start="0" data-duration="10" data-width="640" data-height="1138">
    
      <div id="board-win" class="cyber-card" style="left: 50px; top: 120px; width: 540px; height: 800px; --border-color: var(--cyan); overflow: visible;">
        <svg style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;" viewBox="0 0 540 800">
          <path id="pipeline-path" d="M 270 80 L 270 680" fill="none" stroke="#1a233d" stroke-width="4" />
          <path id="flow-path" d="M 270 80 L 270 680" fill="none" stroke="var(--cyan)" stroke-width="4" stroke-dasharray="600" stroke-dashoffset="600" />
        </svg>
        <div class="pipe-node font-mono" id="node-1" style="position: absolute; left: 195px; top: 60px; text-align: center; width: 150px; display: flex; align-items: center; gap: 10px; background: #060913; padding: 5px 10px; border-radius: 4px; border: 1px solid #1a233d;">
          <span style="font-size: 28px;">🐦</span>
          <span style="font-size: 14px; color: #8c92ac;">1. Twitter搜</span>
        </div>
        <div class="pipe-node font-mono" id="node-2" style="position: absolute; left: 195px; top: 160px; text-align: center; width: 150px; display: flex; align-items: center; gap: 10px; background: #060913; padding: 5px 10px; border-radius: 4px; border: 1px solid #1a233d;">
          <span style="font-size: 28px;">🔎</span>
          <span style="font-size: 14px; color: #8c92ac;">2. 融资筛选</span>
        </div>
        <div class="pipe-node font-mono" id="node-3" style="position: absolute; left: 195px; top: 260px; text-align: center; width: 150px; display: flex; align-items: center; gap: 10px; background: #060913; padding: 5px 10px; border-radius: 4px; border: 1px solid #1a233d;">
          <span style="font-size: 28px;">🏷️</span>
          <span style="font-size: 14px; color: #8c92ac;">3. AI标签</span>
        </div>
        <div class="pipe-node font-mono" id="node-4" style="position: absolute; left: 195px; top: 360px; text-align: center; width: 150px; display: flex; align-items: center; gap: 10px; background: #060913; padding: 5px 10px; border-radius: 4px; border: 1px solid #1a233d;">
          <span style="font-size: 28px;">🌐</span>
          <span style="font-size: 14px; color: #8c92ac;">4. 寻找官网</span>
        </div>
        <div class="pipe-node font-mono" id="node-5" style="position: absolute; left: 195px; top: 460px; text-align: center; width: 150px; display: flex; align-items: center; gap: 10px; background: #060913; padding: 5px 10px; border-radius: 4px; border: 1px solid #1a233d;">
          <span style="font-size: 28px;">👤</span>
          <span style="font-size: 14px; color: #8c92ac;">5. 领英定位</span>
        </div>
        <div class="pipe-node font-mono" id="node-6" style="position: absolute; left: 195px; top: 560px; text-align: center; width: 150px; display: flex; align-items: center; gap: 10px; background: #060913; padding: 5px 10px; border-radius: 4px; border: 1px solid #1a233d;">
          <span style="font-size: 28px;">✈️</span>
          <span style="font-size: 14px; color: #8c92ac;">6. 自动私信</span>
        </div>
        <div id="stamp" class="font-mono" style="position: absolute; left: 70px; top: 280px; border: 5px solid var(--green); border-radius: 10px; color: var(--green); font-size: 54px; font-weight: bold; padding: 15px 50px; transform: rotate(-15deg) scale(3); opacity: 0; box-shadow: 0 0 25px rgba(57,255,20,0.6); background: rgba(6,9,19,0.95); z-index: 10; text-align: center;">
          AUTO RUN
        </div>
      </div>
      <div id="subtitle" style="position: absolute; bottom: 80px; left: 50px; right: 50px; text-align: center; font-size: 28px; color: #fff; line-height: 1.6;">六个步骤。一条指令。全自动跑完。</div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    
    
    tl.fromTo("#board-win", {opacity: 0, scale: 0.95}, {opacity: 1, scale: 1, duration: 0.6}, 0.2);
    tl.fromTo(".pipe-node", {scale: 0, opacity: 0}, {scale: 1, opacity: 1, ease: "back.out(1.5)", duration: 0.4, stagger: 0.2}, 0.8);
    tl.to(document.querySelector("#flow-path").style, {strokeDashoffset: 0, duration: 2.0, ease: "none"}, 0.8);
    tl.to("#stamp", {opacity: 1, scale: 1.0, duration: 0.3, ease: "power4.in"}, 3.2);
    tl.to("#flow-path", {stroke: "var(--green)", duration: 0.1}, 3.5);
    tl.to(".pipe-node", {color: "var(--green)", borderColor: "var(--green)", duration: 0.2, stagger: 0.1}, 3.5);
    tl.fromTo("#subtitle", {opacity: 0}, {opacity: 1, duration: 0.5}, 0.2);

    
    window.__timelines["root"] = tl;
    
    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'togglePlay') {
        if (tl.paused()) tl.play(); else tl.pause();
      } else if (e.data.type === 'restart') {
        tl.restart();
      } else if (e.data.type === 'setSpeed') {
        tl.timeScale(e.data.speed);
      }
    });
  </script>
</body>
</html>
