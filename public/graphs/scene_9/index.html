<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分镜 9: 地球线框与指挥</title>
  <style>
    :root {
      --bg: #060913;
      --green: #39ff14;
      --red: #ff3b3b;
      --cyan: #00fff0;
      --magenta: #ff2d78;
      --blue: #00b3ff;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }
    #stage {
      position: relative;
      width: 900px;
      height: 640px;
      background: #060913;
      border: 2px solid #1a233d;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
      overflow: hidden;
      box-sizing: border-box;
    }
    .cyber-card {
      position: absolute;
      border: 2px solid var(--border-color, #1a233d);
      background: rgba(6, 9, 19, 0.95);
      padding: 15px;
      box-sizing: border-box;
      box-shadow: 0 0 15px var(--glow-color, rgba(0, 243, 255, 0.15));
      border-radius: 4px;
    }
    .font-mono {
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }
  </style>
  <script type="text/javascript" src="js/gsap.min.js"></script>
</head>
<body>
  <div id="stage" data-composition-id="root" data-start="0" data-duration="8" data-width="900" data-height="640">
    
      <div id="earth-glow" style="position: absolute; left: 350px; top: 120px; width: 200px; height: 200px; border-radius: 50%; border: 3px dashed var(--cyan); box-shadow: 0 0 30px rgba(0, 255, 240, 0.2); display: flex; justify-content: center; align-items: center; font-size: 96px;">
        🌍
      </div>
      <div class="agent-dot" style="position: absolute; left: 320px; top: 100px; font-size: 24px; opacity: 0;">🤖</div>
      <div class="agent-dot" style="position: absolute; left: 560px; top: 100px; font-size: 24px; opacity: 0;">🤖</div>
      <div class="agent-dot" style="position: absolute; left: 300px; top: 250px; font-size: 24px; opacity: 0;">🤖</div>
      <div class="agent-dot" style="position: absolute; left: 580px; top: 250px; font-size: 24px; opacity: 0;">🤖</div>
      <div class="agent-dot" style="position: absolute; left: 450px; top: 80px; font-size: 24px; opacity: 0;">🤖</div>
      <div class="agent-dot" style="position: absolute; left: 450px; top: 320px; font-size: 24px; opacity: 0;">🤖</div>
      <div id="boss-card" class="cyber-card font-mono" style="position: absolute; left: 250px; top: 280px; width: 400px; opacity: 0; transform: scale(0.8); --border-color: var(--green); --glow-color: rgba(57,255,20,0.3); text-align: center; padding: 10px;">
         <span style="font-size: 20px; color: var(--green);">💼 管理者/老板思维</span>
         <div style="font-size: 11px; color: #8c92ac; margin-top: 8px;">你不需要会写代码，而是要学会指挥AI。</div>
      </div>
      <div id="subtitle" style="position: absolute; bottom: 50px; left: 50px; right: 50px; text-align: center; font-size: 24px; color: #fff;">未来AI智能体的数量会超过地球人口总数。你不需要会写代码，你需要学会当它的老板。</div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    
    
    tl.fromTo("#earth-glow", {scale: 0.5, rotation: -180, opacity: 0}, {scale: 1, rotation: 0, opacity: 1, duration: 1.0, ease: "power2.out"}, 0.2);
    tl.fromTo(".agent-dot", {scale: 0, opacity: 0}, {scale: 1, opacity: 1, ease: "back.out(2)", duration: 0.5, stagger: 0.15}, 0.8);
    tl.to(["#earth-glow", ".agent-dot"], {scale: 0.8, opacity: 0.3, y: -40, duration: 0.8}, 3.0);
    tl.to("#boss-card", {opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.5)"}, 3.5);
    tl.fromTo("#subtitle", {opacity: 0}, {opacity: 1, duration: 0.5}, 0.2);

    
    window.__timelines["root"] = tl;
    
    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'togglePlay') {
        if (tl.paused()) tl.play(); else tl.pause();
      } else if (e.data.type === 'restart') {
        tl.restart();
      } else if (e.data.type === 'setSpeed') {
        tl.timeScale(e.data.speed);
      }
    });
  </script>
</body>
</html>
