<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分镜 5: 忙碌陀螺与聊天框</title>
  <style>
    :root {
      --bg: #060913;
      --green: #39ff14;
      --red: #ff3b3b;
      --cyan: #00fff0;
      --magenta: #ff2d78;
      --blue: #00b3ff;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }
    #stage {
      position: relative;
      width: 900px;
      height: 640px;
      background: #060913;
      border: 2px solid #1a233d;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
      overflow: hidden;
      box-sizing: border-box;
    }
    .cyber-card {
      position: absolute;
      border: 2px solid var(--border-color, #1a233d);
      background: rgba(6, 9, 19, 0.95);
      padding: 15px;
      box-sizing: border-box;
      box-shadow: 0 0 15px var(--glow-color, rgba(0, 243, 255, 0.15));
      border-radius: 4px;
    }
    .font-mono {
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }
  </style>
  <script type="text/javascript" src="js/gsap.min.js"></script>
</head>
<body>
  <div id="stage" data-composition-id="root" data-start="0" data-duration="7" data-width="900" data-height="640">
    
      <div id="phone-shell" class="cyber-card" style="left: 325px; top: 80px; width: 250px; height: 400px; border-radius: 20px; --border-color: #8c92ac; --glow-color: rgba(255,255,255,0.05); padding: 5px;">
        <div id="phone-screen" style="width: 100%; height: 100%; background: #0c0f1d; border-radius: 15px; overflow: hidden; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center;">
          <div id="app-list" style="position: absolute; top: 0; width: 100%; display: flex; flex-direction: column; gap: 10px; padding: 20px 10px;">
            <div class="cyber-card app-item" style="position: relative; width: 100%; padding: 8px; font-size: 11px; --border-color: var(--blue);">ChatGPT</div>
            <div class="cyber-card app-item" style="position: relative; width: 100%; padding: 8px; font-size: 11px; --border-color: var(--magenta);">Claude</div>
            <div class="cyber-card app-item" style="position: relative; width: 100%; padding: 8px; font-size: 11px; --border-color: var(--cyan);">Perplexity</div>
            <div class="cyber-card app-item" style="position: relative; width: 100%; padding: 8px; font-size: 11px; --border-color: var(--green);">Midjourney</div>
            <div class="cyber-card app-item" style="position: relative; width: 100%; padding: 8px; font-size: 11px; --border-color: #fff;">vLLM</div>
          </div>
          <div id="gyro" style="font-size: 64px; z-index: 10; opacity: 0;">🌀</div>
          <div id="chat-box" class="cyber-card font-mono" style="position: absolute; bottom: 20px; left: 10px; right: 10px; opacity: 0; transform: scale(0.8); --border-color: var(--red); --glow-color: rgba(255,59,59,0.3); padding: 8px; font-size: 11px;">
            <div style="color: var(--red);">[聊天框对话]</div>
            <div style="margin-top: 5px; color: #8c92ac;">你: 写一段代码...</div>
            <div style="margin-top: 5px; color: #39ff14;">AI: 这是您的代码...</div>
          </div>
        </div>
      </div>
      <div id="subtitle" style="position: absolute; bottom: 50px; left: 50px; right: 50px; text-align: center; font-size: 24px; color: #fff;">为什么你装了一堆AI工具，每天还是忙得像个陀螺？原因很简单，因为你用的只是聊天框。</div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    
    
    tl.fromTo("#phone-shell", {scale: 0.7, opacity: 0}, {scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.5)"}, 0.2);
    tl.to("#app-list", {y: -150, duration: 2.0, ease: "power1.inOut"}, 0.8);
    tl.fromTo("#gyro", {scale: 0, opacity: 0, rotation: 0}, {scale: 1, opacity: 1, rotation: 720, duration: 2.0, ease: "power1.inOut"}, 0.8);
    tl.to(["#app-list", "#gyro"], {opacity: 0, duration: 0.3}, 3.0);
    tl.to("#chat-box", {opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)"}, 3.5);
    tl.to("#chat-box", {x: 10, repeat: 3, yoyo: true, duration: 0.05, ease: "power1.inOut"}, 4.2);
    tl.fromTo("#subtitle", {opacity: 0}, {opacity: 1, duration: 0.5}, 0.2);

    
    window.__timelines["root"] = tl;
    
    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'togglePlay') {
        if (tl.paused()) tl.play(); else tl.pause();
      } else if (e.data.type === 'restart') {
        tl.restart();
      } else if (e.data.type === 'setSpeed') {
        tl.timeScale(e.data.speed);
      }
    });
  </script>
</body>
</html>
