<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分镜 2: 同时指挥 5 个 AI 智能体</title>
  <style>
    :root {
      --bg: #060913;
      --green: #39ff14;
      --red: #ff3b3b;
      --cyan: #00fff0;
      --magenta: #ff2d78;
      --blue: #00b3ff;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }
    #stage {
      position: relative;
      width: 900px;
      height: 640px;
      background: #060913;
      border: 2px solid #1a233d;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
      overflow: hidden;
      box-sizing: border-box;
    }
    .cyber-card {
      position: absolute;
      border: 2px solid var(--border-color, #1a233d);
      background: rgba(6, 9, 19, 0.95);
      padding: 15px;
      box-sizing: border-box;
      box-shadow: 0 0 15px var(--glow-color, rgba(0, 243, 255, 0.15));
      border-radius: 4px;
    }
    .font-mono {
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }
  </style>
  <script type="text/javascript" src="js/gsap.min.js"></script>
</head>
<body>
  <div id="stage" data-composition-id="root" data-start="0" data-duration="6" data-width="900" data-height="640">
    
      <div id="grid-container" style="position: absolute; left: 50px; top: 100px; width: 800px; height: 350px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
        <div class="cyber-card agent-win" style="position: relative; --border-color: var(--cyan); --glow-color: rgba(0, 255, 240, 0.2);">
          <div style="color: var(--cyan);">Agent #1</div>
          <div style="font-size: 11px; color: #8c92ac; margin-top: 10px; border-top: 1px solid #1a233d; padding-top: 5px;">Chrome Instance 1<br>Status: Running...</div>
        </div>
        <div class="cyber-card agent-win" style="position: relative; --border-color: var(--magenta); --glow-color: rgba(255, 45, 120, 0.2);">
          <div style="color: var(--magenta);">Agent #2</div>
          <div style="font-size: 11px; color: #8c92ac; margin-top: 10px; border-top: 1px solid #1a233d; padding-top: 5px;">Chrome Instance 2<br>Status: Processing...</div>
        </div>
        <div class="cyber-card agent-win" style="position: relative; --border-color: var(--green); --glow-color: rgba(57, 255, 20, 0.2);">
          <div style="color: var(--green);">Agent #3</div>
          <div style="font-size: 11px; color: #8c92ac; margin-top: 10px; border-top: 1px solid #1a233d; padding-top: 5px;">Chrome Instance 3<br>Status: Crawling...</div>
        </div>
        <div class="cyber-card agent-win" style="position: relative; grid-column: span 1; --border-color: var(--blue); --glow-color: rgba(0, 179, 255, 0.2);">
          <div style="color: var(--blue);">Agent #4</div>
          <div style="font-size: 11px; color: #8c92ac; margin-top: 10px; border-top: 1px solid #1a233d; padding-top: 5px;">Chrome Instance 4<br>Status: Idle</div>
        </div>
        <div class="cyber-card agent-win" style="position: relative; grid-column: span 1; --border-color: #fff; --glow-color: rgba(255, 255, 255, 0.15);">
          <div style="color: #fff;">Agent #5</div>
          <div style="font-size: 11px; color: #8c92ac; margin-top: 10px; border-top: 1px solid #1a233d; padding-top: 5px;">Chrome Instance 5<br>Status: Replying...</div>
        </div>
      </div>
      <div id="subtitle" style="position: absolute; bottom: 50px; left: 50px; right: 50px; text-align: center; font-size: 24px; color: #fff;">海外有个哥们，同时指挥五个AI智能体，每个都有自己的浏览器</div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    
    
    tl.fromTo(".agent-win", {scale: 0.8, opacity: 0}, {scale: 1, opacity: 1, duration: 0.5, ease: "back.out(1.5)", stagger: 0.25}, 0.5);
    tl.fromTo("#subtitle", {opacity: 0}, {opacity: 1, duration: 0.5}, 0.2);

    
    window.__timelines["root"] = tl;
    
    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'togglePlay') {
        if (tl.paused()) tl.play(); else tl.pause();
      } else if (e.data.type === 'restart') {
        tl.restart();
      } else if (e.data.type === 'setSpeed') {
        tl.timeScale(e.data.speed);
      }
    });
  </script>
</body>
</html>
