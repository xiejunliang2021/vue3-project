<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scene 1: 隐私焦虑与数字牢笼</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0d16;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #network {
            width: 100%;
            height: 100%;
        }
        /* Cyberpunk Navigation Panel */
        .nav-control {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 100;
            font-family: 'Courier New', Courier, monospace;
            background: rgba(11, 13, 22, 0.85);
            border: 1px solid #00ffcc;
            padding: 10px 24px;
            border-radius: 6px;
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.25);
            pointer-events: auto;
        }
        .nav-btn {
            color: #00ffcc;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .nav-btn:hover {
            text-shadow: 0 0 8px #00ffcc;
            color: #fff;
        }
        .nav-btn.disabled {
            color: #555;
            cursor: not-allowed;
            pointer-events: none;
        }
        .scene-indicator {
            color: #8c92ac;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div id="network"></div>

    <div class="nav-control">
        <span class="nav-btn disabled">&lt;- 上一幕</span>
        <span class="scene-indicator">分镜 1 / 5</span>
        <a href="saas_vs_local_scene2.html" class="nav-btn">下一幕 -&gt;</a>
    </div>

    <script type="text/javascript">
        var nodesArray = [{"id": 1, "label": "SaaS 云端笔记\\n(Notion/Evernote)", "value": 35, "color": {"background": "#ff007f", "border": "#ff007f"}}, {"id": 2, "label": "资产绑架风险\\n(服务器宕机/封号)", "value": 25, "color": {"background": "#ff5555", "border": "#ff5555"}}, {"id": 3, "label": "隐私泄露风险\\n(用户数据遭监视)", "value": 25, "color": {"background": "#ff5555", "border": "#ff5555"}}, {"id": 4, "label": "免费 AI 训练养料\\n(数据被拿去喂大模型)", "value": 22, "color": {"background": "#e5ff00", "border": "#e5ff00"}}, {"id": 5, "label": "用户敏感资产", "value": 20, "color": {"background": "#ffffff", "border": "#ffffff"}}];
        var edgesArray = [{"from": 5, "to": 1, "label": "数据托管"}, {"from": 1, "to": 2, "label": "单一依赖"}, {"from": 1, "to": 3, "label": "后门条款"}, {"from": 3, "to": 4, "label": "商业利用"}];

        var container = document.getElementById('network');
        var data = {
            nodes: new vis.DataSet(nodesArray),
            edges: new vis.DataSet(edgesArray)
        };

        var options = {
            nodes: {
                shape: 'dot',
                font: {
                    color: '#ffffff',
                    size: 15,
                    face: 'monospace',
                    strokeWidth: 2,
                    strokeColor: '#0b0d16'
                },
                borderWidth: 2,
                shadow: {
                    enabled: true,
                    color: 'rgba(0, 255, 204, 0.3)',
                    size: 10,
                    x: 0,
                    y: 0
                }
            },
            edges: {
                color: {
                    color: 'rgba(255, 255, 255, 0.2)',
                    highlight: '#00ffcc',
                    hover: '#00ffcc'
                },
                font: {
                    color: '#8c92ac',
                    size: 11,
                    face: 'monospace',
                    strokeWidth: 1,
                    strokeColor: '#0b0d16'
                },
                arrows: {
                    to: { enabled: true, scaleFactor: 0.5 }
                },
                smooth: {
                    enabled: true,
                    type: 'cubicBezier',
                    roundness: 0.5
                }
            },
            physics: {
                enabled: true,
                solver: 'forceAtlas2Based',
                forceAtlas2Based: {
                    gravitationalConstant: -180,
                    centralGravity: 0.015,
                    springConstant: 0.04,
                    springLength: 150,
                    damping: 0.45,
                    avoidOverlap: 1
                },
                stabilization: {
                    enabled: false
                }
            },
            interaction: {
                hover: true,
                dragNodes: true,
                dragView: true,
                zoomView: true
            }
        };

        var network = new vis.Network(container, data, options);

        // Keyboard navigation
        document.addEventListener('keydown', function(event) {
            if (event.key === 'ArrowLeft') {
                var prev = "";
                if (prev) window.location.href = prev;
            } else if (event.key === 'ArrowRight') {
                var next = "saas_vs_local_scene2.html";
                if (next) window.location.href = next;
            }
        });
    </script>
</body>
</html>
