<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>竖屏分镜 11</title>
  <style>
    :root {
      --bg: #060913;
      --green: #39ff14;
      --red: #ff3b3b;
      --cyan: #00fff0;
      --magenta: #ff2d78;
      --blue: #00b3ff;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }
    #stage {
      position: relative;
      width: 640px;
      height: 1138px;
      background: #060913;
      border: 2px solid #1a233d;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
      overflow: hidden;
      box-sizing: border-box;
    }
    .cyber-card {
      position: absolute;
      border: 2px solid var(--border-color, #1a233d);
      background: rgba(6, 9, 19, 0.95);
      padding: 15px;
      box-sizing: border-box;
      box-shadow: 0 0 15px var(--glow-color, rgba(0, 243, 255, 0.15));
      border-radius: 4px;
    }
    .font-mono {
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }
  </style>
  <script type="text/javascript" src="js/gsap.min.js"></script>
</head>
<body>
  <div id="stage" data-composition-id="root" data-start="0" data-duration="8" data-width="640" data-height="1138">
    
      <div id="outro-card" class="cyber-card font-mono" style="left: 70px; top: 220px; width: 500px; --border-color: var(--green); --glow-color: rgba(57,255,20,0.3); text-align: center; padding: 40px 25px;">
        <div style="font-size: 32px; color: var(--green); font-weight: bold;">搭建你的一人公司</div>
        <div style="font-size: 18px; color: #8c92ac; margin-top: 25px; line-height: 1.5;">下班后，花20分钟尝试<br>Coze 或者是 Dify 平台</div>
        <div style="font-size: 72px; margin-top: 30px;">🚀</div>
        <div style="font-size: 22px; color: var(--cyan); margin-top: 30px; text-shadow: 0 0 8px var(--cyan); font-weight: bold;">关注「肖恩」· 开启AI自动化</div>
      </div>
      <div id="subtitle" style="position: absolute; bottom: 80px; left: 50px; right: 50px; text-align: center; font-size: 28px; color: #fff; line-height: 1.6;">花20分钟去试一个零代码平台。关注肖恩，我们一起搭建属于自己的一人公司。</div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    
    
    tl.fromTo("#outro-card", {scale: 0.8, y: 50, opacity: 0}, {scale: 1, y: 0, opacity: 1, ease: "back.out(1.8)", duration: 0.8}, 0.2);
    tl.to("#outro-card", {boxShadow: "0 0 30px rgba(57,255,20,0.5)", duration: 1.0, yoyo: true, repeat: 2}, 1.2);
    tl.fromTo("#subtitle", {opacity: 0}, {opacity: 1, duration: 0.5}, 0.2);

    
    window.__timelines["root"] = tl;
    
    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'togglePlay') {
        if (tl.paused()) tl.play(); else tl.pause();
      } else if (e.data.type === 'restart') {
        tl.restart();
      } else if (e.data.type === 'setSpeed') {
        tl.timeScale(e.data.speed);
      }
    });
  </script>
</body>
</html>
