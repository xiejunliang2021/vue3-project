<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>竖屏分镜 6</title>
  <style>
    :root {
      --bg: #060913;
      --green: #39ff14;
      --red: #ff3b3b;
      --cyan: #00fff0;
      --magenta: #ff2d78;
      --blue: #00b3ff;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      color: #ffffff;
    }
    #stage {
      position: relative;
      width: 640px;
      height: 1138px;
      background: #060913;
      border: 2px solid #1a233d;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
      overflow: hidden;
      box-sizing: border-box;
    }
    .cyber-card {
      position: absolute;
      border: 2px solid var(--border-color, #1a233d);
      background: rgba(6, 9, 19, 0.95);
      padding: 15px;
      box-sizing: border-box;
      box-shadow: 0 0 15px var(--glow-color, rgba(0, 243, 255, 0.15));
      border-radius: 4px;
    }
    .font-mono {
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }
  </style>
  <script type="text/javascript" src="js/gsap.min.js"></script>
</head>
<body>
  <div id="stage" data-composition-id="root" data-start="0" data-duration="8" data-width="640" data-height="1138">
    
      <div id="split-container" style="position: absolute; left: 50px; top: 120px; width: 540px; height: 800px; display: flex; flex-direction: column; gap: 40px;">
        <div id="panel-left" class="cyber-card" style="height: 330px; opacity: 0; --border-color: #555; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;">
          <div class="font-mono" style="font-size: 24px; color: #8c92ac;">被动聊天框</div>
          <div style="font-size: 72px; margin-top: 15px;">💬</div>
          <div style="font-size: 16px; color: #555; margin-top: 15px;">你不问 · 它不动</div>
        </div>
        <div id="panel-right" class="cyber-card" style="height: 430px; opacity: 0; --border-color: var(--cyan); --glow-color: rgba(0, 255, 240, 0.2); display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 20px;">
          <div class="font-mono" style="font-size: 24px; color: var(--cyan);">AI Agent 智能体</div>
          <div id="agent-core" style="font-size: 72px; margin-top: 15px;">🤖</div>
          <div id="node-t1" class="cyber-card font-mono" style="position: absolute; opacity: 0; padding: 10px; font-size: 14px; --border-color: var(--green); left: 30px; bottom: 100px;">1. 拆解任务</div>
          <div id="node-t2" class="cyber-card font-mono" style="position: absolute; opacity: 0; padding: 10px; font-size: 14px; --border-color: var(--green); right: 30px; bottom: 100px;">2. 调用工具</div>
          <div id="node-t3" class="cyber-card font-mono" style="position: absolute; opacity: 0; padding: 10px; font-size: 14px; --border-color: var(--green); bottom: 30px; width: 140px; text-align: center;">3. 自动运行</div>
        </div>
      </div>
      <div id="subtitle" style="position: absolute; bottom: 80px; left: 50px; right: 50px; text-align: center; font-size: 28px; color: #fff; line-height: 1.6;">而Agent，是你给它一个目标，它自己拆任务、找工具、跑流程。</div>

  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    
    
    tl.fromTo("#panel-left", {y: -20, opacity: 0}, {y: 0, opacity: 1, duration: 0.6}, 0.2);
    tl.fromTo("#panel-right", {y: 20, opacity: 0}, {y: 0, opacity: 1, duration: 0.6}, 0.6);
    tl.to("#agent-core", {scale: 1.2, duration: 0.3, ease: "power1.out"}, 1.5);
    tl.to("#agent-core", {scale: 1.0, duration: 0.3, ease: "power1.in"}, 1.8);
    tl.fromTo("#node-t1", {scale: 0.5, y: -20, opacity: 0}, {scale: 1, y: 0, opacity: 1, ease: "back.out(2)", duration: 0.4}, 2.0);
    tl.fromTo("#node-t2", {scale: 0.5, y: -20, opacity: 0}, {scale: 1, y: 0, opacity: 1, ease: "back.out(2)", duration: 0.4}, 2.3);
    tl.fromTo("#node-t3", {scale: 0.5, y: -20, opacity: 0}, {scale: 1, y: 0, opacity: 1, ease: "back.out(2)", duration: 0.4}, 2.6);
    tl.to("#panel-right", {boxShadow: "0 0 30px rgba(0, 255, 240, 0.45)", duration: 0.8, yoyo: true, repeat: 3}, 3.0);
    tl.fromTo("#subtitle", {opacity: 0}, {opacity: 1, duration: 0.5}, 0.2);

    
    window.__timelines["root"] = tl;
    
    window.addEventListener('message', (e) => {
      if (!e.data) return;
      if (e.data.type === 'togglePlay') {
        if (tl.paused()) tl.play(); else tl.pause();
      } else if (e.data.type === 'restart') {
        tl.restart();
      } else if (e.data.type === 'setSpeed') {
        tl.timeScale(e.data.speed);
      }
    });
  </script>
</body>
</html>
